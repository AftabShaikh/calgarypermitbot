name: Deploy Calgary Permit Bot

on:
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: 'Deployment stage to run'
        required: true
        default: 'prepare'
        type: choice
        options:
          - prepare
          - deploy
          - full
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_data_upload:
        description: 'Skip data folder upload'
        required: false
        type: boolean
        default: false

env:
  AZURE_RESOURCE_GROUP: rg-calgarypermitbot
  AZURE_LOCATION: westus2
  APP_SERVICE_SKU: B1

jobs:
  prepare-resources:
    name: 'Prepare Azure Resources'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deployment_stage == 'prepare' || github.event.inputs.deployment_stage == 'full' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set up Azure CLI
      run: |
        az --version
        az account show

    - name: Load deployment configuration
      run: |
        if [ -f "./deploy/config.sh" ]; then
          source ./deploy/config.sh
          echo "Configuration loaded"
        else
          echo "Configuration file not found, using defaults"
        fi

    - name: Prepare Azure Resources
      run: |
        echo "🚀 Starting resource preparation..."
        chmod +x ./deploy/01-prepare-resources.sh
        ./deploy/01-prepare-resources.sh
      env:
        RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
        LOCATION: ${{ env.AZURE_LOCATION }}
        APP_SERVICE_SKU: ${{ env.APP_SERVICE_SKU }}

    - name: Upload deployment configuration
      uses: actions/upload-artifact@v4
      with:
        name: deployment-config
        path: /tmp/deployment-config.env
        retention-days: 1

    - name: Save resource information
      run: |
        echo "✅ Resources prepared successfully!"
        echo "Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
        echo "Location: ${{ env.AZURE_LOCATION }}"
        
        # Output key resource information
        if [ -f /tmp/deployment-config.env ]; then
          echo "=== Deployment Configuration ==="
          cat /tmp/deployment-config.env
        fi

  deploy-application:
    name: 'Deploy Application'
    runs-on: ubuntu-latest
    needs: prepare-resources
    if: |
      always() && 
      (github.event.inputs.deployment_stage == 'deploy' || github.event.inputs.deployment_stage == 'full') &&
      (needs.prepare-resources.result == 'success' || needs.prepare-resources.result == 'skipped')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'app/frontend/package-lock.json'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Download deployment configuration
      uses: actions/download-artifact@v4
      if: github.event.inputs.deployment_stage == 'full'
      with:
        name: deployment-config
        path: /tmp/
      continue-on-error: true

    - name: Load or create deployment configuration
      run: |
        if [ -f "/tmp/deployment-config.env" ]; then
          echo "📋 Using configuration from prepare-resources job"
          source /tmp/deployment-config.env
        else
          echo "📋 Creating configuration for deploy-only run"
          source ./deploy/config.sh
          
          # Save essential configuration for deploy script
          cat > /tmp/deployment-config.env << EOF
        RESOURCE_GROUP=${RESOURCE_GROUP}
        LOCATION=${LOCATION}
        APP_SERVICE_PLAN=${APP_SERVICE_PLAN}
        APP_SERVICE_SKU=${APP_SERVICE_SKU}
        BACKEND_APP_NAME=${BACKEND_APP_NAME}
        FRONTEND_APP_NAME=${FRONTEND_APP_NAME}
        STORAGE_ACCOUNT=${STORAGE_ACCOUNT}
        STORAGE_CONTAINER=${STORAGE_CONTAINER}
        SEARCH_SERVICE=${SEARCH_SERVICE}
        OPENAI_SERVICE=${OPENAI_SERVICE}
        COSMOS_ACCOUNT=${COSMOS_ACCOUNT}
        COSMOS_DATABASE=${COSMOS_DATABASE}
        COSMOS_CONTAINER=${COSMOS_CONTAINER}
        EOF
        fi
        
        echo "Configuration loaded:"
        cat /tmp/deployment-config.env

    - name: Validate required resources exist
      run: |
        source /tmp/deployment-config.env
        
        echo "🔍 Validating Azure resources exist..."
        
        # Check resource group
        if ! az group show --name "$RESOURCE_GROUP" > /dev/null 2>&1; then
          echo "❌ Resource group '$RESOURCE_GROUP' not found"
          exit 1
        fi
        
        # Check backend app service
        if ! az webapp show --name "$BACKEND_APP_NAME" --resource-group "$RESOURCE_GROUP" > /dev/null 2>&1; then
          echo "❌ Backend app service '$BACKEND_APP_NAME' not found"
          echo "💡 Make sure to run the 'prepare' stage first"
          exit 1
        fi
        
        # Check frontend app service  
        if ! az webapp show --name "$FRONTEND_APP_NAME" --resource-group "$RESOURCE_GROUP" > /dev/null 2>&1; then
          echo "❌ Frontend app service '$FRONTEND_APP_NAME' not found"
          echo "💡 Make sure to run the 'prepare' stage first"
          exit 1
        fi
        
        echo "✅ All required resources found"

    - name: Deploy Applications and Upload Data
      run: |
        echo "🚀 Starting application deployment..."
        chmod +x ./deploy/02-deploy-app.sh
        
        # Set environment variable for data upload skip
        if [ "${{ github.event.inputs.skip_data_upload }}" = "true" ]; then
          export SKIP_DATA_UPLOAD=true
          echo "⏭️  Skipping data upload as requested"
        fi
        
        ./deploy/02-deploy-app.sh
      env:
        SKIP_DATA_UPLOAD: ${{ github.event.inputs.skip_data_upload }}

    - name: Run post-deployment health checks
      run: |
        source /tmp/deployment-config.env
        
        echo "🏥 Running health checks..."
        
        BACKEND_URL="https://${BACKEND_APP_NAME}.azurewebsites.net"
        FRONTEND_URL="https://${FRONTEND_APP_NAME}.azurewebsites.net"
        
        echo "Waiting for services to be ready..."
        sleep 60
        
        # Check backend health
        echo "🔧 Checking backend at: $BACKEND_URL"
        if curl -f --max-time 30 "$BACKEND_URL/health" > /dev/null 2>&1; then
          echo "✅ Backend is healthy"
        else
          echo "⚠️  Backend health check failed (may need more time to start)"
        fi
        
        # Check frontend
        echo "🎨 Checking frontend at: $FRONTEND_URL"
        if curl -f --max-time 30 --head "$FRONTEND_URL" > /dev/null 2>&1; then
          echo "✅ Frontend is responding"
        else
          echo "⚠️  Frontend health check failed (may need more time to start)"
        fi
        
        echo ""
        echo "🌐 Application URLs:"
        echo "   Frontend: $FRONTEND_URL"
        echo "   Backend:  $BACKEND_URL"
        echo "   Health:   $BACKEND_URL/health"

  # Deploy-only job (when running just the deploy stage without prepare)
  deploy-only:
    name: 'Deploy Application Only'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deployment_stage == 'deploy' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'app/frontend/package-lock.json'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create deployment configuration
      run: |
        source ./deploy/config.sh
        
        # Auto-detect resources if they exist
        STORAGE_ACCOUNT=$(az storage account list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'calgarypermitbot')].name | [0]" -o tsv 2>/dev/null || echo "")
        
        if [ -z "$STORAGE_ACCOUNT" ]; then
          echo "❌ Could not auto-detect storage account. Please run the 'prepare' stage first."
          exit 1
        fi
        
        # Save configuration
        cat > /tmp/deployment-config.env << EOF
        RESOURCE_GROUP=${RESOURCE_GROUP}
        LOCATION=${LOCATION}
        APP_SERVICE_PLAN=${APP_SERVICE_PLAN}
        APP_SERVICE_SKU=${APP_SERVICE_SKU}
        BACKEND_APP_NAME=${BACKEND_APP_NAME}
        FRONTEND_APP_NAME=${FRONTEND_APP_NAME}
        STORAGE_ACCOUNT=${STORAGE_ACCOUNT}
        STORAGE_CONTAINER=${STORAGE_CONTAINER}
        SEARCH_SERVICE=${SEARCH_SERVICE}
        OPENAI_SERVICE=${OPENAI_SERVICE}
        COSMOS_ACCOUNT=${COSMOS_ACCOUNT}
        COSMOS_DATABASE=${COSMOS_DATABASE}
        COSMOS_CONTAINER=${COSMOS_CONTAINER}
        EOF
        
        echo "✅ Configuration created for deploy-only run"

    - name: Deploy Applications
      run: |
        chmod +x ./deploy/02-deploy-app.sh
        ./deploy/02-deploy-app.sh